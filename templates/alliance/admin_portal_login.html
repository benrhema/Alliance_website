{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Admin — The Alliance</title>
  <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/main.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/admin-portal.css' %}"/>
</head>
<body class="portal-body">
  <div class="portal-login-page">
    <div class="portal-login-bg" data-particles>
      <canvas data-particles data-particle-color="126, 232, 162"></canvas>
    </div>

    <div class="portal-login-card">
      <div class="portal-login-brand">
        <img src="{% static 'images/logo.png' %}" alt="" class="logo-img" width="48" height="48"/>
        <div>
          <h1>Admin</h1>
          <p>The Alliance</p>
        </div>
      </div>

      {% if form.errors %}
        <div class="portal-alert-error">Invalid username or password. Please try again.</div>
      {% endif %}

      <form method="post" autocomplete="on">
        {% csrf_token %}
        <label for="id_username">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" placeholder="Your username" required />

        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />

        <button type="submit" class="portal-btn-primary">Sign in</button>
      </form>

      <a href="{% url 'home' %}" class="portal-back-link" rel="nofollow">← Back to website</a>
    </div>
  </div>

  <script src="{% static 'js/admin-cache-guard.js' %}"></script>
  <script src="{% static 'js/particles.js' %}"></script>
</body>
</html>
