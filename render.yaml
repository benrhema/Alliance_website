# Render Blueprint — optional: import this when creating services from the dashboard.
services:
  - type: web
    name: alliance-website
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn alliance_website.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alliance-db
          property: connectionString

databases:
  - name: alliance-db
    plan: free
    databaseName: alliance
    user: alliance
